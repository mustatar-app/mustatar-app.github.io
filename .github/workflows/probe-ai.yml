name: Probe the free AI services
on:
  push:
    branches: [probe-ai]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
      - name: Live server, every AI job
        run: |
          U=https://jund-notes-ai.dawajund.workers.dev; O=https://mustatar.dawajund.workers.dev
          curl -sS $U/; echo
          P() { curl -sS -m 120 -o out.txt -w "%{http_code} %{time_total}s" -X POST "$U$1" -H "origin: $O" -H "x-mst-stream: openai" "${@:2}"; echo " | $(grep -o '"content":"[^"]*"' out.txt | sed 's/"content":"//;s/"$//' | tr -d '\n' | head -c 400)$(grep -o '"text":"[^"]*"' out.txt | head -c 400) $(grep -o '"code":"[^"]*"' out.txt)"; }
          echo "notes (Gemma):"; P /write -H 'content-type: application/json' -d '{"system":"Write short meeting minutes.","user":"Meeting: budget approved; launch moved one week; Sara sends the invite by Friday.","json":false,"maxTokens":600}'
          echo "study JSON:"; P /write -H 'content-type: application/json' -d '{"system":"Make study notes from this lesson.","user":"الدرس: آداب طالب العلم: الإخلاص، والصبر، واحترام المعلم.","json":true,"studyNotes":true,"maxTokens":2000}'
          espeak-ng -v en -w e.wav "Good morning. Today we will discuss the budget and the launch date." 
          ffmpeg -loglevel error -i e.wav -c:a aac -b:a 64k -f adts e.aac; ffmpeg -loglevel error -i e.wav -b:a 64k e.mp3; ffmpeg -loglevel error -i e.wav -c:a libopus -b:a 32k e.webm
          echo "aac (Cloudflare):"; P "/transcribe?mime=audio/aac&langs=ar,en" -H 'content-type: audio/aac' --data-binary @e.aac
          echo "mp3 (Groq):"; P "/transcribe?mime=audio/mpeg&langs=ar,en" -H 'content-type: audio/mpeg' --data-binary @e.mp3
          ffmpeg -loglevel error -f lavfi -i anullsrc=r=16000:cl=mono -t 25 -b:a 32k s.mp3
          echo "silence:"; P "/transcribe?mime=audio/mpeg&langs=ar,en" -H 'content-type: audio/mpeg' --data-binary @s.mp3
          ffmpeg -loglevel error -f lavfi -i color=c=white:s=600x160 -vf "drawtext=text='Meeting on Friday at 10':fontsize=36:x=10:y=60" -frames:v 1 p.jpg
          echo "photo of a page:"; P "/transcribe?mime=image/jpeg" -H 'content-type: image/jpeg' --data-binary @p.jpg
          img=$(base64 -w0 p.jpg); printf '{"pages":[{"page":1,"data":"%s"},{"page":2,"data":"%s"}]}' "$img" "$img" > pages.json
          echo "two scanned pages:"; P /read-pages -H 'content-type: application/json' --data-binary @pages.json
          a=$(base64 -w0 e.webm); printf '{"audio":"%s","mime":"audio/webm","system":"Answer briefly.","user":"","langs":"ar,en"}' "$a" > v.json
          echo "voice:"; P /ask-voice -H 'content-type: application/json' --data-binary @v.json
          printf '{"file":"%s","mime":"image/jpeg","name":"board.jpg","user":"When is the meeting?","system":"Answer briefly."}' "$img" > f.json
          echo "ask about a photo:"; P /ask-file -H 'content-type: application/json' --data-binary @f.json
