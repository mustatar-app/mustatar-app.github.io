name: Live hearing check (Arabic and English speech through the real server and app)
on:
  workflow_dispatch:
  pull_request:
    paths: ['tests/audio_live.py', '.github/workflows/audio-live.yml']
permissions:
  contents: read
concurrency: audio-live
jobs:
  hearing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q gtts playwright==1.* && python -m playwright install --with-deps chromium > /dev/null
      - name: Hearing check
        run: python3 tests/audio_live.py
