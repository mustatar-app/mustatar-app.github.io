name: Check the app
# Runs on every proposed change and on every change to main: the code must be valid and the app
# must open, show every screen, turn a transcript into a note and send its task to the calendar.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: tests-${{ github.ref }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: The code is valid
        run: |
          for f in *.js server/*.js; do node --check "$f" || exit 1; done
          for f in *.json .well-known/*.json manifest.webmanifest; do python3 -m json.tool "$f" > /dev/null || { echo "Broken: $f"; exit 1; }; done
      - name: The free AI engine picks the right source and waits in line when all are full
        run: node tests/engine_test.mjs
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Get the test browser
        run: pip install playwright==1.* && python -m playwright install --with-deps chromium
      - name: The app works in a phone-sized browser
        run: |
          python3 -m http.server 8765 > /dev/null 2>&1 &
          sleep 1
          python3 tests/app_test.py http://localhost:8765/
          python3 tests/smaller_test.py http://localhost:8765/
      - name: Moving to the new address, recordings and privacy page
        run: python3 tests/move_test.py
      - name: Long recordings are cut into 2-minute pieces at quiet moments
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          python3 tests/media_test.py http://localhost:8765/
      - name: Studio saves and shares pictures, videos and carousels (browser, and as inside the Android app)
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          python3 tests/studio_test.py http://localhost:8765/
          python3 tests/batch_test.py http://localhost:8765/
      - name: Proof for each line, how much was heard, and bringing work from Keep, Evernote, Notion and Word
        run: |
          pip install -q python-docx
          python3 tests/proof_import_test.py http://localhost:8765/
          python3 tests/countdown_test.py http://localhost:8765/
      - name: Accounts and private spaces work (pretend passkey, server on this machine)
        run: |
          (python3 -m http.server 8765 > /dev/null 2>&1 &) || true
          # Cloudflare's AI cannot run on this machine, so the test server starts without it (the AI is tested by tests/engine_test.mjs)
          (cd server && npm ci && sed '/^\[ai\]/,/^binding/d' wrangler.toml > wrangler.test.toml && npx --yes wrangler@4 dev -c wrangler.test.toml --port 8787 --ip 127.0.0.1 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 2; done
          python3 tests/space_test.py http://localhost:8765/ http://127.0.0.1:8787 || { tail -40 /tmp/server.log; exit 1; }
          python3 tests/sync_test.py http://localhost:8765/ http://127.0.0.1:8787 || { tail -40 /tmp/server.log; exit 1; }
      - name: The server's AI routes work (pretend Groq, server on this machine)
        run: |
          (cd server && npx --yes wrangler@4 dev -c wrangler.test.toml --port 8788 --ip 127.0.0.1 --persist-to /tmp/ai-state \
             --var GROQ_API_KEY:gsk_test --var GROQ_BASE:http://127.0.0.1:8799 > /tmp/server-ai.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8788/ && break; sleep 2; done
          python3 tests/server_ai_test.py check http://127.0.0.1:8788 || { tail -40 /tmp/server-ai.log; exit 1; }
