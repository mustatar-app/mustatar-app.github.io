plugins { id 'com.android.application' version '8.7.3' apply false }

// Keep Android runtime dependencies separate from the existing APK signing configuration.
project(':app') {
    configurations.configureEach {
        exclude group: 'com.google.androidbrowserhelper', module: 'androidbrowserhelper'
    }
    plugins.withId('com.android.application') {
        dependencies.add('implementation', 'androidx.webkit:webkit:1.14.0')
        // FileProvider: hands files made in the app to the share sheet
        dependencies.add('implementation', 'androidx.core:core:1.13.1')
        // passkeys inside the app's web view (Android Credential Manager)
        dependencies.add('implementation', 'androidx.credentials:credentials:1.6.0-beta02')
        dependencies.add('implementation', 'androidx.credentials:credentials-play-services-auth:1.6.0-beta02')
        // "Continue with Google" inside the app (Android's own Google sign-in sheet)
        dependencies.add('implementation', 'com.google.android.libraries.identity.googleid:googleid:1.1.1')
    }
}
