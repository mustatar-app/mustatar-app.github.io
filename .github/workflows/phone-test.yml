name: Test on an Android phone
# The real app on an Android emulator: Studio save and share, video, carousel, sharing words, reading aloud.
on:
  pull_request:
    paths: ['android/**', 'native.js', 'studio.js', 'app.js', 'voice.js', 'recorder.js', 'media.js', 'dictate.js', 'tests/phone_test.py', 'tests/phone_audio_test.py', '.github/workflows/phone-test.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: phone-test-${{ github.ref }}
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9', cache-read-only: true }
      - name: Build the test app
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Sample photo and phone video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p tests/samples
          # a real photo from the internet; a made one if it cannot be downloaded
          curl -sfL -A "Mozilla/5.0 (Mustatar test)" -o tests/samples/photo.jpg "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg" \
            || ffmpeg -loglevel error -f lavfi -i testsrc2=s=4000x3000 -frames:v 1 tests/samples/photo.jpg
          # a phone-style video: H.264 and AAC in MP4, upright, 4 seconds
          ffmpeg -loglevel error -f lavfi -i testsrc2=s=720x1280:r=30 -f lavfi -i sine=f=440 -t 4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart tests/samples/clip.mp4
          ls -la tests/samples
      - name: Real Arabic and English speech (for hearing inside the app)
        run: |
          pip install -q gtts
          python3 -c "from gtts import gTTS; gTTS('بسم الله الرحمن الرحيم. درس اليوم عن الصيام. الصيام ركن من أركان الإسلام، ويبدأ من طلوع الفجر إلى غروب الشمس. ومن أكل ناسيا فليتم صومه.', lang='ar').save('tests/speech-ar.mp3'); gTTS('Good morning everyone. Today is meeting is about the product launch. We agreed to finish the design on Monday, test with five users on Wednesday, and launch on Sunday.', lang='en').save('tests/speech-en.mp3')"
          ls -la tests/speech-*.mp3
      - name: Serve the app's pages
        run: (python3 -m http.server 8765 > /tmp/web.log 2>&1 &) && pip install -q websocket-client pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the app on an Android 14 phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # a silent microphone (no -noaudio), so recording inside the app can be tested
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8765 tcp:8765
            python3 tests/phone_test.py
            cd tests && python3 phone_audio_test.py
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: phone-shots/
