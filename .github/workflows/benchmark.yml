name: Benchmark (live server, real speech)
# Real Arabic and English speech (FLEURS) through the live server: hearing accuracy and speed, notes,
# page reading, the assistant, voice, and the whole app making a note from a recording.
on:
  pull_request:
    paths: ['tests/benchmark.py', '.github/workflows/benchmark.yml', 'server/**']
  schedule:
    - cron: '17 2 * * 1'   # every Monday morning (Makkah time), to catch a slower or worse free AI early
  workflow_dispatch:
permissions:
  contents: read
concurrency: benchmark
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 > /dev/null
          pip install -q playwright==1.* pillow && python -m playwright install --with-deps chromium > /dev/null
      - name: Cache the speech samples
        uses: actions/cache@v4
        with: { path: bench-work, key: fleurs-test-v1 }
      - name: Why words are missed (Groq directly)
        continue-on-error: true
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: python3 tests/hear_diag.py
      - name: Run the benchmark
        run: |
          (python3 -m http.server 8765 > /dev/null 2>&1 &)
          python3 tests/benchmark.py
