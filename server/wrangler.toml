name = "jund-notes-ai"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# reminders when the app is closed (Web Push): a small store and a check every minute
[[kv_namespaces]]
binding = "PUSH"
id = "KV_ID_PLACEHOLDER"

[triggers]
crons = ["* * * * *"]

# each person's own private database, and the sign-in database (see space.js)
[[durable_objects.bindings]]
name = "SPACE"
class_name = "UserSpace"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1-accounts-and-spaces"
new_sqlite_classes = ["UserSpace", "Accounts"]

# "Continue with Google": the public client id from Google Cloud (empty = the button is hidden)
[vars]
GOOGLE_CLIENT_ID = "667190468571-f4rph9bnbjh6kko3vq4lb54pufbfm9lb.apps.googleusercontent.com"
