name: Deploy the app's server
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Are the keys in place?
        id: chk
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$A" ] && [ -n "$B" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Keys not added yet; skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Claim a free workers.dev address (first time only)
        if: steps.chk.outputs.ok == 'true'
        continue-on-error: true
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain"
          have=$(curl -fsS -H "Authorization: Bearer $T" "$api" | jq -r '.result.subdomain // empty' || true)
          if [ -n "$have" ]; then echo "Already have: $have.workers.dev"; exit 0; fi
          for name in jund-notes jundnotes jund-notes-app "jund-$(echo $A | cut -c1-6)"; do
            jq -n --arg s "$name" '{subdomain:$s}' > body.json
            r=$(curl -sS -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @body.json "$api")
            if [ "$(echo "$r" | jq -r .success)" != "true" ]; then
              r=$(curl -sS -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary "\"$name\"" "$api"); fi
            if [ "$(echo "$r" | jq -r .success)" = "true" ]; then echo "Claimed $name.workers.dev"; sleep 20; exit 0; fi
            echo "$name: $(echo "$r" | jq -c .errors)"
          done
          exit 1
      - name: Make the reminders store (first time only)
        if: steps.chk.outputs.ok == 'true'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(printf %s "$T" | tr -d '[:space:]'); A=$(printf %s "$A" | tr -d '[:space:]')   # a pasted key may end with a new line
          api="https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces"
          l=$(curl -sS -H "Authorization: Bearer $T" "$api?per_page=100"); echo "list: $(echo "$l" | jq -c '.success, .errors')"
          id=$(echo "$l" | jq -r '.result[]? | select(.title=="daftar-push") | .id' | head -1)
          if [ -z "$id" ]; then
            r=$(curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data '{"title":"daftar-push"}' "$api"); echo "$r" | jq -c '.errors' || true
            id=$(echo "$r" | jq -r '.result.id // empty')
          fi
          if [ -n "$id" ]; then sed -i "s/KV_ID_PLACEHOLDER/$id/" server/wrangler.toml; echo "Reminders store: ready"
          else echo "Could not make the reminders store; deploying without it"; python3 - <<'PY'
          import re; p='server/wrangler.toml'; s=open(p).read()
          s=re.sub(r'\[\[kv_namespaces\]\][^\[]*', '', s); open(p,'w').write(s)
          PY
          fi
      - name: Get the server's libraries
        if: steps.chk.outputs.ok == 'true'
        working-directory: server
        run: npm ci
      - name: Deploy to Cloudflare
        if: steps.chk.outputs.ok == 'true'
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.163.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
      - name: Hand the AI keys to the server (only the ones that are added)
        if: steps.chk.outputs.ok == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ: ${{ secrets.GROQ_API_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          GROQ=$(printf %s "$GROQ" | tr -d '[:space:]'); GEMINI=$(printf %s "$GEMINI" | tr -d '[:space:]'); CLAUDE=$(printf %s "$CLAUDE" | tr -d '[:space:]')   # a pasted key may end with a new line
          jq -n --arg g "$GROQ" --arg m "$GEMINI" --arg c "$CLAUDE" '{} + (if $g != "" then {GROQ_API_KEY: $g} else {} end) + (if $m != "" then {GEMINI_API_KEY: $m} else {} end) + (if $c != "" then {ANTHROPIC_API_KEY: $c} else {} end)' > keys.json
          echo "Keys handed over: $(jq -r 'keys | join(", ")' keys.json)"
          if [ "$(jq length keys.json)" -gt 0 ]; then npx --yes wrangler@4.163.0 secret bulk keys.json; fi
          rm -f keys.json
          [ -n "$GROQ" ] || echo "::warning::GROQ_API_KEY is not in the GitHub secrets yet: hearing uses Cloudflare only."
      - name: Tell the app where its server is
        if: steps.chk.outputs.ok == 'true'
        run: |
          URL="${{ steps.wr.outputs.deployment-url }}"
          if [ -z "$URL" ]; then URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' <<< "${{ steps.wr.outputs.command-output }}" | head -1); fi
          echo "Server: $URL"
          test -n "$URL"
          printf '{"url":"%s"}\n' "$URL" > server.json
          if ! git diff --quiet -- server.json 2>/dev/null || [ -z "$(git ls-files server.json)" ]; then
            git config user.name "jund-notes bot"; git config user.email "actions@github.com"
            git add server.json && git commit -m "Server address" && git push
          fi
      - name: Check the server answers
        if: steps.chk.outputs.ok == 'true'
        run: |
          URL=$(sed -E 's/.*"url":"([^"]+)".*/\1/' server.json)
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/" && exit 0; sleep 5; done; exit 1
      - name: Check the free AI answers (a short sentence, and a short sound)
        if: steps.chk.outputs.ok == 'true'
        run: |
          URL=$(sed -E 's/.*"url":"([^"]+)".*/\1/' server.json); O=https://mustatar.dawajund.workers.dev
          sleep 5
          curl -sS -X POST "$URL/write" -H "origin: $O" -H 'content-type: application/json' \
            -d '{"system":"Answer in one short sentence.","user":"Say hello in Arabic.","json":false,"assistant":true,"maxTokens":200}' | head -c 600; echo
          sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null 2>&1 || true
          if command -v espeak-ng > /dev/null; then
            espeak-ng -v en -w t.wav "Good morning. This is a short test of the meeting notes." && ffmpeg -loglevel error -i t.wav -b:a 64k t.mp3
            curl -sS -X POST "$URL/transcribe?mime=audio/mpeg&langs=en" -H "origin: $O" -H 'content-type: audio/mpeg' --data-binary @t.mp3 | head -c 600; echo
          fi
