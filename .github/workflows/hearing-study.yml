name: Hearing study (Groq, one-speaker speech)
on:
  workflow_dispatch:
  push:
    branches: [hearing-study]
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install playwright==1.* && python -m playwright install --with-deps chromium > /dev/null
      - uses: actions/cache@v4
        with: { path: bench-work, key: fleurs-test-v1 }
      - name: Study
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}", STUDY: short }
        run: python3 tests/hearing_study.py
