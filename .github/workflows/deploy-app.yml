name: Publish the app on Cloudflare
# The same files GitHub Pages serves, also published on Cloudflare's network (site/wrangler.toml).
# Uses the Cloudflare keys already in GitHub's secrets for the server.
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'server/**', 'tests/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-app
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Are the keys in place?
        id: chk
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$A" ] && [ -n "$B" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::Cloudflare keys not added yet; skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to Cloudflare
        if: steps.chk.outputs.ok == 'true'
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.163.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
      - name: Check the app opens there
        if: steps.chk.outputs.ok == 'true'
        run: |
          URL="${{ steps.wr.outputs.deployment-url }}"
          if [ -z "$URL" ]; then URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' <<< "${{ steps.wr.outputs.command-output }}" | head -1); fi
          echo "The app on Cloudflare: $URL"
          echo "### The app on Cloudflare: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS "$URL/" | grep -q "<html" && curl -fsS "$URL/.well-known/assetlinks.json" | grep -q app.mustatar; then echo "Opens fine."; exit 0; fi
            sleep 5
          done
          exit 1
